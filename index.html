
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>ふたりの家計簿</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f7fa;
      padding: 20px;
      color: #222;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      margin: 16px 0;
      box-shadow: 0 2px 8px #0001;
    }
    h1 { color: #16856b; }
    .amount {
      font-size: 30px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>ふたりの家計簿</h1>
  <p>家計簿アプリのテスト画面</p>

  <div class="card">
    <h3>今月の総予算</h3>
    <div class="amount">500,000円</div>
  </div>

  <div class="card">
    <h3>健太郎のお小遣い</h3>
    <div class="amount">30,000円</div>
  </div>

  <div class="card">
    <h3>舞のお小遣い</h3>
    <div class="amount">30,000円</div>
  </div>

  <div class="card">
    <h3>共通生活費</h3>
    <div class="amount">440,000円</div>
  </div>
</body>
</html>
